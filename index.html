    function ToastContainer({ toasts, onDismiss }) {
      return (
        <div className="fixed top-24 right-4 sm:right-6 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full">
          {toasts.map((toast) => {
            let icon = 'check_circle';
            let iconColor = 'text-[#004a32]';
            let borderColor = 'border-l-4 border-[#004a32]';

            if (toast.type === 'danger') {
              icon = 'error';
              iconColor = 'text-[#DC2626]';
              borderColor = 'border-l-4 border-[#DC2626]';
            } else if (toast.type === 'info') {
              icon = 'info';
              iconColor = 'text-[#0051d5]';
              borderColor = 'border-l-4 border-[#0051d5]';
            }

            return (
              <div
                key={toast.id}
                className={`pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 bg-white rounded-xl shadow-xl border border-gray-100 ${borderColor} text-[#151c27] transition-all transform animate-fade-in`}
              >

                    {icon}
                  </span>
                  <div className="font-bold text-[13px] leading-snug break-words">

                </div>

                  type="button"
                  onClick={() => onDismiss(toast.id)}
                  className="text-gray-400 hover:text-gray-600 p-1 shrink-0"
                >

                </button>
              </div>
            );

          const date = String(now.getDate()).padStart(2, '0');
          const hours = String(now.getHours()).padStart(2, '0');
          const minutes = String(now.getMinutes()).padStart(2, '0');
          const seconds = String(now.getSeconds()).padStart(2, '0');
          setServerTime(`${year}.${month}.${date} ${hours}:${minutes}:${seconds} KST`);
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

    // --- 5. TAB 1: COURSE SEARCH & REGISTER PANE ---
    function CourseSearchPane({ courses, enrolledCodes, onApplyCourse }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [deptFilter, setDeptFilter] = useState('ALL');

      const filteredCourses = useMemo(() => {
        return courses.filter((c) => {
          const matchTerm =
            searchTerm === '' ||
            c.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            c.prof.toLowerCase().includes(searchTerm.toLowerCase()) ||
            c.code.includes(searchTerm);

          const matchType = typeFilter === 'ALL' || c.type === typeFilter;
          const matchDept = deptFilter === 'ALL' || c.dept === deptFilter;

          return matchTerm && matchType && matchDept;
        });
      }, [courses, searchTerm, typeFilter, deptFilter]);

      const handleReset = () => {
        setSearchTerm('');
        setTypeFilter('ALL');
        setDeptFilter('ALL');
      };

      return (
        <div className="p-4 sm:p-6 flex flex-col gap-4">
          <div className="bg-[#f0f3ff] p-4 rounded-xl border border-[#dce1ff] flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-3 flex-1 min-w-[300px]">
              <div className="flex items-center gap-1.5 text-xs">
                <span className="font-bold text-gray-700">학과/전공:</span>
                <select
                  value={deptFilter}
                  onChange={(e) => setDeptFilter(e.target.value)}
                  className="bg-white border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs focus:ring-2 focus:ring-[#0051d5] focus:outline-none"
                >
                  <option value="ALL">전체 개설학과</option>
                  <option value="컴퓨터공학부">컴퓨터공학부</option>
                  <option value="전자전기공학부">전자전기공학부</option>
                  <option value="경영학부">경영학부</option>
                  <option value="인문대학">인문대학</option>
                </select>
              </div>

              <div className="flex items-center gap-1.5 text-xs">
                <span className="font-bold text-gray-700">이수구분:</span>
                <select
                  value={typeFilter}
                  onChange={(e) => setTypeFilter(e.target.value)}
                  className="bg-white border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs focus:ring-2 focus:ring-[#0051d5] focus:outline-none"
                >
                  <option value="ALL">전체 이수구분</option>
                  <option value="전필">전공필수(전필)</option>
                  <option value="전선">전공선택(전선)</option>
                  <option value="교필">교양필수(교필)</option>
                  <option value="교선">교양선택(교선)</option>
                </select>
              </div>

              <div className="relative flex-1 min-w-[200px]">
                <span className="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-[18px]">
                  search
                </span>
                <input
                  type="text"
                  placeholder="교과목명, 교수명, 학수번호 검색..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full bg-white border border-gray-300 rounded-lg pl-8 pr-3 py-1.5 text-xs focus:ring-2 focus:ring-[#0051d5] focus:outline-none"
                />
              </div>
            </div>

            <div className="flex items-center gap-2 text-xs">
              <span className="text-gray-500">
                조회결과: <strong className="text-[#00236f]">{filteredCourses.length}</strong>건
              </span>
              <button
                type="button"
                onClick={handleReset}
                className="px-2.5 py-1.5 bg-white border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-100 flex items-center gap-1 transition-colors"
              >
                <span className="material-symbols-outlined text-[14px]">restart_alt</span>
                <span>초기화</span>
              </button>
            </div>
          </div>

          <div className="overflow-x-auto rounded-xl border border-gray-200 bg-white">
            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-200 text-gray-600">
                  <th className="py-3 px-3 w-16 text-center font-bold">학수번호</th>
                  <th className="py-3 px-3 w-16 text-center font-bold">이수구분</th>
                  <th className="py-3 px-3 font-bold">교과목명</th>
                  <th className="py-3 px-3 w-20 font-bold">담당교수</th>
                  <th className="py-3 px-3 w-12 text-center font-bold">학점</th>
                  <th className="py-3 px-3 font-bold">강의시간</th>
                  <th className="py-3 px-3 w-28 font-bold">강의실</th>
                  <th className="py-3 px-3 w-32 font-bold">신청 / 정원</th>
                  <th className="py-3 px-3 w-24 text-center font-bold">신청상태</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {filteredCourses.map((course) => {
                  const isEnrolled = enrolledCodes.has(course.code);
                  const isFull = course.enrolled >= course.max || course.closed;
                  const percent = Math.min(100, Math.round((course.enrolled / course.max) * 100));

                  let typeBadgeColor = 'bg-blue-100 text-blue-800';
                  if (course.type === '전필') typeBadgeColor = 'bg-[#00236f] text-white';
                  else if (course.type === '교필') typeBadgeColor = 'bg-amber-100 text-amber-800';
                  else if (course.type === '교선') typeBadgeColor = 'bg-emerald-100 text-emerald-800';

                  return (
                    <tr
                      key={course.code}
                      className={`hover:bg-blue-50/40 transition-colors ${
                        isEnrolled ? 'bg-blue-50/20' : ''
                      }`}
                    >
                      <td className="py-3 px-3 text-center font-mono-code font-bold text-gray-700">
                        {course.code}
                      </td>
                      <td className="py-3 px-3 text-center">
                        <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${typeBadgeColor}`}>
                          {course.type}
                        </span>
                      </td>
                      <td className="py-3 px-3 font-medium text-gray-900">
                        <div className="flex items-center gap-1.5">
                          <span>{course.title}</span>
                          {course.dept && (
                            <span className="text-[10px] text-gray-400 bg-gray-100 px-1.5 py-0.2 rounded">
                              {course.dept}
                            </span>
                          )}
                        </div>
                      </td>
                      <td className="py-3 px-3 text-gray-700">{course.prof}</td>
                      <td className="py-3 px-3 text-center font-mono-code font-bold text-gray-900">
                        {course.credits}
                      </td>
                      <td className="py-3 px-3 text-gray-600">{course.schedule}</td>
                      <td className="py-3 px-3 text-gray-600">{course.loc}</td>
                      <td className="py-3 px-3">
                        <div className="flex flex-col gap-1">
                          <div className="flex justify-between items-center text-[11px]">
                            <span className="font-mono-code font-bold text-gray-700">
                              {course.enrolled}/{course.max}
                            </span>
                            <span
                              className={`font-mono-code font-bold ${
                                isFull ? 'text-red-600' : 'text-blue-600'
                              }`}
                            >
                              {isFull ? '마감' : `잔여 ${course.max - course.enrolled}석`}
                            </span>
                          </div>
                          <div className="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
                            <div
                              className={`h-full rounded-full transition-all ${
                                isFull ? 'bg-red-500' : percent > 80 ? 'bg-amber-500' : 'bg-blue-600'
                              }`}
                              style={{ width: `${percent}%` }}
                            ></div>
                          </div>
                        </div>
                      </td>
                      <td className="py-3 px-3 text-center">
                        {isEnrolled ? (
                          <span className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-emerald-100 text-emerald-800 font-bold text-xs">
                            <span className="material-symbols-outlined text-[14px]">check</span>
                            신청완료
                          </span>
                        ) : isFull ? (
                          <span className="inline-flex items-center justify-center px-2.5 py-1.5 rounded-lg bg-gray-100 text-gray-400 font-bold text-xs cursor-not-allowed">
                            정원마감
                          </span>
                        ) : (
                          <button
                            type="button"
                            onClick={() => onApplyCourse(course)}
                            className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-[#0051d5] hover:bg-[#00236f] text-white font-bold text-xs shadow-xs transition-all active:scale-95"
                          >
                            <span className="material-symbols-outlined text-[14px]">add</span>
                            수강신청
                          </button>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- 6. TAB 2: BASKET PANE ---
    function BasketPane({ basketList, enrolledCodes, onApplyCourse, onRemoveFromBasket }) {

        <div className="p-4 sm:p-6 flex flex-col gap-4">
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start gap-3">
            <span className="material-symbols-outlined text-amber-600 text-[22px] mt-0.5">
              info
            </span>
            <div className="text-xs text-amber-900 leading-relaxed">
              <strong className="font-bold">장바구니(관심과목) 유의사항:</strong>
              <p className="mt-0.5">
                장바구니에 담긴 강좌는 수강신청이 확정된 것이 아니며, 우측의{' '}
                <span className="font-bold text-[#00236f]">[신청]</span> 버튼을 클릭하여{' '}

              <thead>
                <tr className="bg-gray-50 border-b border-gray-200 text-gray-600">
                  <th className="py-3 px-3 w-16 text-center font-bold">우선순위</th>
                  <th className="py-3 px-3 w-16 text-center font-bold">학수번호</th>
                  <th className="py-3 px-3 w-16 text-center font-bold">이수구분</th>
                  <th className="py-3 px-3 font-bold">교과목명</th>
                  <th className="py-3 px-3 w-20 font-bold">담당교수</th>
                  <th className="py-3 px-3 w-12 text-center font-bold">학점</th>
                  <th className="py-3 px-3 font-bold">강의시간</th>

                        </td>
                        <td className="py-3 px-3 text-center font-mono-code font-bold text-gray-700">
                          {course.code}
                        </td>
                        <td className="py-3 px-3 text-center">
                          <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-gray-100 text-gray-700">
                            {course.type}
                          </span>
                        </td>
                        <td className="py-3 px-3 font-medium text-gray-900">{course.title}</td>
                        <td className="py-3 px-3 text-gray-700">{course.prof}</td>
                        <td className="py-3 px-3 text-center font-mono-code font-bold text-gray-900">
                          {course.credits}
                        </td>
                        <td className="py-3 px-3 text-gray-600">{course.schedule}</td>
                        <td className="py-3 px-3 text-gray-600">{course.loc}</td>
                        <td className="py-3 px-3">
                          <span className="font-mono-code font-bold text-gray-700">
                            {course.enrolled}/{course.max}
                          </span>
                          <span
                            className={`ml-1 text-[11px] font-bold ${
                              isFull ? 'text-red-600' : 'text-emerald-600'
                            }`}

    // --- 7. TAB 3: TIMETABLE PANE ---
    function TimetablePane({ enrolledCourses }) {
      const days = ['월', '화', '수', '목', '금'];
      const periods = [
        { period: '1교시', time: '09:00 - 10:15' },
        { period: '2교시', time: '10:30 - 11:45' },
        { period: '3교시', time: '12:00 - 13:15' },
        { period: '4교시', time: '13:30 - 14:45' },
        { period: '5교시', time: '15:00 - 16:15' },
        { period: '6교시', time: '16:30 - 17:45' },
      ];

      const getCourseForSlot = (day, pIndex) => {
        return enrolledCourses.find((c) => {
          const [dPart, tPart] = c.schedule.split(' ');
          if (!dPart) return false;
          const matchDay = dPart.split('/').includes(day);
          if (!matchDay) return false;

          if (pIndex === 0 && tPart.includes('09:00')) return true;
          if (pIndex === 1 && tPart.includes('10:30')) return true;
          if (pIndex === 2 && tPart.includes('12:00')) return true;
          if (pIndex === 3 && tPart.includes('13:00')) return true;
          if (pIndex === 4 && (tPart.includes('15:00') || tPart.includes('16:00'))) return true;
          if (pIndex === 5 && tPart.includes('16:30')) return true;

          return false;
        });
      };

      const courseColors = [
        'bg-blue-50 border-blue-200 text-blue-950',
        'bg-indigo-50 border-indigo-200 text-indigo-950',
        'bg-emerald-50 border-emerald-200 text-emerald-950',
        'bg-amber-50 border-amber-200 text-amber-950',
        'bg-purple-50 border-purple-200 text-purple-950',
        'bg-rose-50 border-rose-200 text-rose-950',
      ];

      return (
        <div className="p-4 sm:p-6 flex flex-col gap-4">
          <div className="flex items-center justify-between">
            <h3 className="text-sm font-bold text-[#00236f] flex items-center gap-1.5">
              <span className="material-symbols-outlined text-[18px]">calendar_view_week</span>
              <span>2024-2학기 주간 시간표 매트릭스 (총 {enrolledCourses.length}과목 반영)</span>
            </h3>
            <span className="text-xs text-gray-500">
              * 정규 수강신청이 승인된 과목만 자동 배치됩니다.
            </span>
          </div>

          <div className="overflow-x-auto rounded-xl border border-gray-200 bg-white">
            <table className="w-full border-collapse text-xs table-fixed">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-200 text-gray-600">
                  <th className="w-24 p-2.5 text-center font-bold border-r border-gray-200">
                    교시 / 시간
                  </th>
                  {days.map((d) => (
                    <th key={d} className="p-2.5 text-center font-bold border-r border-gray-200 last:border-r-0">
                      {d}요일
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-200">
                {periods.map((p, pIndex) => (
                  <tr key={p.period} className="h-20">
                    <td className="p-2 text-center bg-gray-50 border-r border-gray-200 font-medium">
                      <div className="font-bold text-gray-700">{p.period}</div>
                      <div className="text-[10px] text-gray-400 font-mono-code">{p.time}</div>
                    </td>
                    {days.map((day) => {
                      const matched = getCourseForSlot(day, pIndex);
                      const colorIdx = matched
                        ? enrolledCourses.findIndex((c) => c.code === matched.code) % courseColors.length
                        : 0;

                      return (
                        <td
                          key={day}
                          className="p-1 border-r border-gray-200 last:border-r-0 align-top transition-colors hover:bg-gray-50/50"
                        >
                          {matched ? (
                            <div
                              className={`h-full p-2 rounded-lg border shadow-xs flex flex-col justify-between ${courseColors[colorIdx]}`}
                            >
                              <div>
                                <span className="font-bold block truncate text-[11px]">
                                  {matched.title}
                                </span>
                                <span className="text-[10px] opacity-80">{matched.prof} 교수</span>
                              </div>
                              <span className="text-[9px] font-mono-code opacity-70 truncate mt-1">
                                {matched.loc}
                              </span>
                            </div>
                          ) : (
                            <div className="h-full w-full rounded flex items-center justify-center text-gray-200 text-[10px]">
                              -
                            </div>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- 8. ENROLLED LEDGER COMPONENT ---
    function EnrolledLedger({ enrolledCourses, maxCredits, onCancelEnrollment, onOpenPdfModal }) {
      const totalCredits = enrolledCourses.reduce((acc, c) => acc + c.credits, 0);

      return (
        <section id="enrolled-ledger" className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
          <div className="px-4 sm:px-6 py-4 bg-[#00236f] text-white flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2">
              <span className="material-symbols-outlined text-[20px] text-blue-300">
                fact_check
              </span>
              <h2 className="font-bold text-base tracking-tight">수강신청 완료 내역서</h2>
              <span className="text-xs bg-blue-900/80 px-2 py-0.5 rounded text-blue-200">
                총 {enrolledCourses.length}과목 / {totalCredits}학점 확정
              </span>
            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={onOpenPdfModal}
                className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-bold flex items-center gap-1.5 transition-all border border-white/20"
              >
                <span className="material-symbols-outlined text-[16px]">print</span>
                <span>수강신청 확인서 (PDF/인쇄)</span>
              </button>
            </div>
          </div>

          <div className="overflow-x-auto p-4 sm:p-6">
            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-200 text-gray-600">
                  <th className="py-2.5 px-3 w-12 text-center font-bold">순번</th>
                  <th className="py-2.5 px-3 w-16 text-center font-bold">학수번호</th>
                  <th className="py-2.5 px-3 w-16 text-center font-bold">이수구분</th>
                  <th className="py-2.5 px-3 font-bold">교과목명</th>
                  <th className="py-2.5 px-3 w-20 font-bold">담당교수</th>
                  <th className="py-2.5 px-3 w-12 text-center font-bold">학점</th>
                  <th className="py-2.5 px-3 font-bold">강의시간</th>
                  <th className="py-2.5 px-3 w-28 font-bold">강의실</th>
                  <th className="py-2.5 px-3 w-20 text-center font-bold">취소</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {enrolledCourses.length === 0 ? (
                  <tr>
                    <td colSpan={9} className="py-12 text-center text-gray-400">
                      현재 수강신청 완료된 과목이 없습니다.
                    </td>
                  </tr>
                ) : (
                  enrolledCourses.map((course, idx) => (
                    <tr key={course.code} className="hover:bg-gray-50 transition-colors">
                      <td className="py-3 px-3 text-center font-mono-code font-bold text-gray-400">
                        {idx + 1}
                      </td>
                      <td className="py-3 px-3 text-center font-mono-code font-bold text-gray-800">
                        {course.code}
                      </td>
                      <td className="py-3 px-3 text-center">
                        <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-blue-100 text-blue-900">
                          {course.type}
                        </span>
                      </td>
                      <td className="py-3 px-3 font-medium text-gray-900">{course.title}</td>
                      <td className="py-3 px-3 text-gray-700">{course.prof}</td>
                      <td className="py-3 px-3 text-center font-mono-code font-bold text-[#00236f]">
                        {course.credits}
                      </td>
                      <td className="py-3 px-3 text-gray-600">{course.schedule}</td>
                      <td className="py-3 px-3 text-gray-600">{course.loc}</td>
                      <td className="py-3 px-3 text-center">
                        <button
                          type="button"
                          onClick={() => onCancelEnrollment(course.code)}
                          className="px-2.5 py-1 rounded bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold transition-colors"
                        >
                          취소
                        </button>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>

            <div className="mt-4 p-3 bg-[#f0f3ff] rounded-xl border border-[#dce1ff] flex flex-wrap items-center justify-between gap-3 text-xs">
              <div className="flex items-center gap-2 text-[#00236f]">
                <span className="material-symbols-outlined text-[18px]">verified</span>
                <span>정규 수강신청 최종 신청결과입니다. 취소 시 정원은 즉시 복구됩니다.</span>
              </div>
              <div className="flex items-center gap-4">
                <span>총 신청과목: <strong>{enrolledCourses.length}과목</strong></span>
                <span className="text-sm font-bold text-[#00236f]">
                  총 신청학점: {totalCredits} / {maxCredits} 학점
                </span>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // --- 9. CAPTCHA MODAL COMPONENT (Image 3) ---
    function CaptchaModal({ course, onClose, onSuccess }) {
      const [digits, setDigits] = useState(['', '', '', '', '']);
      const [secondsRemaining, setSecondsRemaining] = useState(45);
      const [sessionAlertSeconds, setSessionAlertSeconds] = useState(48);
      const [errorMessage, setErrorMessage] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [shake, setShake] = useState(false);
      const hiddenInputRef = useRef(null);

      useEffect(() => {
        if (course) {
          setDigits(['', '', '', '', '']);
          setSecondsRemaining(45);
          setSessionAlertSeconds(48);
          setErrorMessage('');
          setIsSubmitting(false);

          setTimeout(() => {
            hiddenInputRef.current?.focus();
          }, 50);
        }
      }, [course]);

      useEffect(() => {
        if (!course) return;
        const timer = setInterval(() => {
          setSecondsRemaining((prev) => (prev > 1 ? prev - 1 : 60));
          setSessionAlertSeconds((prev) => (prev > 1 ? prev - 1 : 60));
        }, 1000);
        return () => clearInterval(timer);
      }, [course]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      if (!course) return null;

      const targetCode = course.code;
      const targetDigits = targetCode.split('');
      const enteredCode = digits.join('');
      const filledCount = digits.filter((d) => d !== '').length;

      const handleContainerClick = () => {
        hiddenInputRef.current?.focus();
      };

      const handleHiddenInputChange = (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '').slice(0, 5);
        const newDigits = ['', '', '', '', ''];
        for (let i = 0; i < val.length; i++) {
          newDigits[i] = val[i];
        }
        setDigits(newDigits);
        setErrorMessage('');
      };

      const handleSubmit = () => {
        if (isSubmitting) return;

        if (enteredCode.length < 5) {
          setErrorMessage('5자리 숫자를 모두 입력해 주십시오.');
          setShake(true);
          setTimeout(() => setShake(false), 400);
          return;
        }

        if (enteredCode !== targetCode) {
          setErrorMessage('학수번호 5자리가 일치하지 않습니다. 다시 확인해주세요.');
          setShake(true);
          setTimeout(() => setShake(false), 400);
          hiddenInputRef.current?.focus();
          return;
        }

        setIsSubmitting(true);
        setErrorMessage('');

        setTimeout(() => {
          setIsSubmitting(false);
          onSuccess(course);
        }, 400);
      };

      const handleRefreshCode = () => {
        setSecondsRemaining(60);
        setDigits(['', '', '', '', '']);
        setErrorMessage('');
        hiddenInputRef.current?.focus();
      };

      let digitHint = '숫자 5자리를 차례로 입력하세요';
      if (filledCount === 4) digitHint = '마지막 1자리를 입력하세요';
      else if (filledCount === 5) digitHint = '입력 완료! [확인]을 누르세요';
      else if (filledCount > 0) digitHint = `${5 - filledCount}자리를 더 입력하세요`;

      return (
        <React.Fragment>
          <div className="fixed top-24 right-4 sm:right-6 z-[60] flex flex-col gap-2 pointer-events-none w-80">
            <div className="bg-white shadow-xl rounded-xl p-3 sm:p-4 flex items-start gap-3 border-l-4 border-[#F59E0B] border border-gray-100 pointer-events-auto transition-all animate-bounce-short">
              <span className="material-symbols-outlined text-[#F59E0B] text-[20px] mt-0.5">
                timer
              </span>
              <div className="flex flex-col min-w-0 flex-1">
                <span className="font-bold text-[13px] text-[#151c27]">보안 인증 대기 중</span>
                <span className="text-[12px] text-[#444651] truncate">
                  제한시간 내(60초) 코드를 입력하세요...
                </span>
              </div>
              <span className="font-mono-code text-[14px] text-[#DC2626] font-bold">
                00:{String(sessionAlertSeconds).padStart(2, '0')}
              </span>
            </div>
          </div>

          <div
            className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/65 backdrop-blur-xs transition-opacity"
            onClick={onClose}
          >
            <div
              className={`bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col transform transition-all relative ${
                shake ? 'animate-shake' : ''
              }`}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="h-2 w-full bg-gradient-to-r from-[#00236f] via-[#0051d5] to-[#0284C7]"></div>

              <div className="px-5 sm:px-6 pt-5 pb-3 flex items-start justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-xl bg-[#f0f3ff] flex items-center justify-center text-[#0051d5] shadow-xs border border-[#dce1ff]">
                    <span className="material-symbols-outlined text-[26px]">
                      fitbit_hourly_activity
                    </span>
                  </div>
                  <div className="flex flex-col">
                    <span className="font-bold text-[18px] text-[#00236f] tracking-tight leading-tight">
                      수강신청 보안 확인 번호 입력
                    </span>
                    <span className="text-[12px] text-[#444651] font-mono-code mt-0.5">
                      Security Code Verification
                    </span>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={onClose}
                  className="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors"
                  title="창 닫기 (Esc)"
                >
                  <span className="material-symbols-outlined text-[20px]">close</span>
                </button>
              </div>

              <div className="px-5 sm:px-6 py-3 flex flex-col gap-4">
                <p className="text-[13px] text-[#444651] leading-relaxed">
                  부정 매크로 프로그램을 방지하고 오신청을 예방하기 위해 아래 발급된{' '}
                  <strong className="text-[#00236f] font-bold">
                    5자리 보안 확인 번호(학수번호)
                  </strong>
                  를 정확히 입력해 주십시오.
                </p>

                <div className="bg-[#f0f3ff] p-3.5 rounded-xl flex items-center justify-between border border-[#dce1ff]">
                  <div className="flex flex-col min-w-0">
                    <div className="flex items-center gap-1.5">
                      <span className="bg-[#fef3c7] text-[#92400e] text-[11px] font-bold px-1.5 py-0.5 rounded">
                        {course.type}
                      </span>
                      <span className="font-bold text-[14px] text-[#151c27] truncate">
                        {course.title}
                      </span>
                    </div>
                    <span className="text-[12px] text-[#444651] mt-0.5">
                      {course.credits}.0학점 · {course.prof} 교수 · {course.loc}
                    </span>
                  </div>

                  <div className="text-right flex flex-col items-end shrink-0 pl-2">
                    <span className="text-[10px] text-[#DC2626] font-bold uppercase tracking-wider">
                      실시간 잔여
                    </span>
                    <div className="flex items-center gap-1 mt-0.5">
                      <span className="w-2 h-2 rounded-full bg-[#DC2626] animate-ping"></span>
                      <span className="font-mono-code text-[14px] text-[#DC2626] font-bold">
                        {Math.max(0, course.max - course.enrolled)}석
                      </span>
                    </div>
                  </div>
                </div>

                <div className="flex flex-col gap-1.5">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-bold text-[#444651] uppercase tracking-wider flex items-center gap-1">
                      <span className="material-symbols-outlined text-[15px] text-[#0051d5]">pin</span>
                      화면 제시 번호 (학수번호 일치)
                    </span>
                    <button
                      type="button"
                      onClick={handleRefreshCode}
                      className="text-[12px] text-gray-500 hover:text-[#0051d5] flex items-center gap-1 transition-colors"
                    >
                      <span className="material-symbols-outlined text-[14px]">refresh</span>
                      <span>자동 갱신 남음: </span>
                      <strong className="font-mono-code text-[#0051d5] font-bold">
                        {secondsRemaining}초
                      </strong>
                    </button>
                  </div>

                  <div className="relative w-full h-24 bg-[#e7eefe] rounded-xl overflow-hidden flex items-center justify-center select-none shadow-inner border border-[#c5c5d3]">
                    <div
                      className="absolute inset-0 opacity-20 pointer-events-none"
                      style={{
                        backgroundImage:
                          'radial-gradient(#1e3a8a 1px, transparent 1px), radial-gradient(#0051d5 1px, transparent 1px)',
                        backgroundSize: '10px 10px',
                        backgroundPosition: '0 0, 5px 5px',
                      }}
                    ></div>

                    <svg
                      className="absolute inset-0 w-full h-full text-[#0051d5]/25 pointer-events-none"
                      preserveAspectRatio="none"
                      viewBox="0 0 400 100"
                    >
                      <path
                        d="M 0,50 Q 80,10 160,50 T 320,50 T 400,30"
                        fill="none"
                        stroke="currentColor"
                        strokeDasharray="6,4"
                        strokeWidth="2.5"
                      ></path>
                      <path
                        d="M 0,70 Q 100,90 200,40 T 400,60"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="1.5"
                      ></path>
                    </svg>

                    <div className="relative z-10 flex items-center justify-center gap-5 sm:gap-6 tracking-[0.35em] text-[#00236f]">
                      {targetDigits.map((char, index) => {
                        const rotations = ['-rotate-3', 'rotate-2', '-rotate-2', 'rotate-3', '-rotate-1'];
                        const colors = [
                          'text-[#1e3a8a]',
                          'text-[#00236f]',
                          'text-[#0051d5]',
                          'text-[#1e3a8a]',
                          'text-[#00236f]',
                        ];
                        return (
                          <span
                            key={index}
                            className={`font-mono-code text-[30px] sm:text-[34px] font-extrabold inline-block transform ${rotations[index % rotations.length]} ${colors[index % colors.length]} select-none drop-shadow-xs`}
                          >
                            {char}
                          </span>
                        );
                      })}
                    </div>

                    <span className="absolute bottom-1 right-2 font-mono-code text-[10px] text-gray-500/60 uppercase tracking-widest pointer-events-none">
                      HANKUK ANTI-BOT PROTOCOL v4
                    </span>
                  </div>
                </div>

                <div className="flex flex-col gap-1.5" onClick={handleContainerClick}>
                  <div className="flex items-center justify-between">
                    <label className="text-[13px] text-[#151c27] font-bold flex items-center gap-1">
                      확인 번호 입력 <span className="text-[#DC2626]">*</span>
                    </label>
                    <span className="text-[12px] text-[#0051d5] font-medium">{digitHint}</span>
                  </div>

                  <input
                    ref={hiddenInputRef}
                    type="text"
                    inputMode="numeric"
                    autoComplete="off"
                    maxLength={5}
                    value={enteredCode}
                    onChange={handleHiddenInputChange}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') handleSubmit();
                    }}
                    className="opacity-0 absolute -z-10 pointer-events-none"
                  />

                  <div className="grid grid-cols-5 gap-2.5 w-full cursor-pointer">
                    {[0, 1, 2, 3, 4].map((index) => {
                      const digit = digits[index];
                      const isActive = index === filledCount;
                      const isFilled = digit !== '';

                      return (
                        <div
                          key={index}
                          className={`h-14 rounded-xl flex items-center justify-center font-mono-code text-[24px] font-bold transition-all ${
                            isFilled
                              ? 'bg-white text-[#00236f] shadow-sm border-2 border-[#1e3a8a]/40'
                              : isActive
                              ? 'bg-white text-[#0051d5] shadow-md border-2 border-[#0051d5] ring-2 ring-[#0051d5]/20'
                              : 'bg-[#f0f3ff] text-gray-400 border border-[#dce1ff]'
                          }`}
                        >
                          {isFilled ? (
                            digit
                          ) : isActive ? (
                            <span className="w-0.5 h-6 bg-[#0051d5] animate-pulse inline-block"></span>
                          ) : (
                            <span className="text-gray-300 text-[14px] font-normal">_</span>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  <div className="flex items-center justify-between mt-1 text-[#444651] text-[12px]">
                    <span className="flex items-center gap-1">
                      <span className="material-symbols-outlined text-[16px] text-[#0284C7]">
                        keyboard
                      </span>
                      숫자 5자리를 모두 채우면 자동 확인 활성화
                    </span>
                    <span className="font-mono-code font-bold text-[#00236f]">
                      {filledCount} / 5 자리 완료
                    </span>
                  </div>

                  {errorMessage && (
                    <div className="text-[#DC2626] text-[12px] flex items-center gap-1 mt-1 font-bold animate-fade-in">
                      <span className="material-symbols-outlined text-[16px]">error</span>
                      <span>{errorMessage}</span>
                    </div>
                  )}
                </div>

                <div className="bg-[#ffdad6]/40 p-3 rounded-xl flex items-start gap-2.5 text-[#93000a] border border-[#ffdad6]">
                  <span className="material-symbols-outlined text-[#DC2626] text-[20px] shrink-0 mt-0.5">
                    warning
                  </span>
                  <div className="flex flex-col text-[12px] leading-relaxed">
                    <span className="font-bold text-[#DC2626]">유의사항 및 실시간 안내</span>
                    <span>
                      3회 이상 불일치 시 30초간 모든 과목 신청이 자동 차단됩니다. 또한 보안창 입력
                      중에도 실시간 수강 경쟁으로 잔여석이 전량 마감될 수 있습니다.
                    </span>
                  </div>
                </div>
              </div>

              <div className="px-5 sm:px-6 py-4 bg-[#f0f3ff] flex items-center justify-between gap-3 border-t border-gray-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl text-[13px] font-bold text-[#444651] hover:text-[#151c27] hover:bg-gray-200 transition-all border border-gray-200"
                >
                  취소 (Esc)
                </button>

                <button
                  type="button"
                  onClick={handleSubmit}
                  disabled={isSubmitting}
                  className={`px-5 py-2.5 rounded-xl font-bold text-[14px] text-white transition-all shadow-md flex items-center gap-2 active:scale-95 ${
                    filledCount === 5
                      ? 'bg-[#0051d5] hover:bg-[#00236f]'
                      : 'bg-[#0051d5]/70 hover:bg-[#0051d5]'
                  }`}
                >
                  {isSubmitting ? (
                    <React.Fragment>
                      <span className="material-symbols-outlined text-[18px] animate-spin">
                        progress_activity
                      </span>
                      <span>검증 승인 중...</span>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <span className="material-symbols-outlined text-[18px]">check_circle</span>
                      <span>확인 및 수강신청 (Enter)</span>
                    </React.Fragment>
                  )}
                </button>
              </div>
            </div>
          </div>
        </React.Fragment>
      );
    }

    // --- 10. PDF CONFIRMATION MODAL ---
    function PdfModal({ isOpen, onClose, enrolledCourses, totalCredits }) {
      if (!isOpen) return null;

      const today = new Date().toLocaleDateString('ko-KR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      });

      const handlePrint = () => {
        window.print();
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-xs"
          onClick={onClose}
        >
          <div
            className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl p-6 sm:p-8 flex flex-col max-h-[90vh] overflow-y-auto"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between pb-4 border-b border-gray-200 no-print">
              <div className="flex items-center gap-2">
                <span className="material-symbols-outlined text-[#00236f] text-[24px]">description</span>
                <span className="font-bold text-[16px] text-[#00236f]">수강신청 확인서 (공식 전자문서)</span>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-700 hover:bg-gray-100"
              >
                <span className="material-symbols-outlined text-[20px]">close</span>
              </button>
            </div>

            <div id="print-certificate-area" className="mt-4 p-6 border border-gray-300 rounded-lg bg-white text-[#151c27] relative">
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-[0.04]">
                <span className="material-symbols-outlined text-[220px]">school</span>
              </div>

              <div className="text-center mb-6">
                <h1 className="text-[22px] font-bold tracking-widest text-[#00236f]">
                  수 강 신 청 확 인 서
                </h1>
                <p className="text-[12px] text-gray-500 mt-1">2024학년도 제 2학기 정규 수강신청</p>
              </div>

              <div className="grid grid-cols-2 gap-2 text-[12px] border border-gray-200 p-3 bg-gray-50 rounded-md mb-4">
                <div>
                  <span className="font-bold text-gray-600">성 명: </span>
                  <span>홍길동</span>
                </div>
                <div>
                  <span className="font-bold text-gray-600">학 번: </span>
                  <span className="font-mono-code">20240001</span>
                </div>
                <div>
                  <span className="font-bold text-gray-600">소 속: </span>
                  <span>공과대학 컴퓨터공학부</span>
                </div>
                <div>
                  <span className="font-bold text-gray-600">발급일자: </span>
                  <span>{today}</span>
                </div>
              </div>

              <table className="w-full text-left border-collapse text-[12px] border border-gray-300 mb-4">
                <thead>
                  <tr className="bg-gray-100 border-b border-gray-300 text-gray-700">
                    <th className="p-2 w-12 text-center">순번</th>
                    <th className="p-2 w-20">학수번호</th>
                    <th className="p-2">교과목명</th>
                    <th className="p-2 w-16 text-center">이수구분</th>
                    <th className="p-2 w-12 text-center">학점</th>
                    <th className="p-2 w-20">담당교수</th>
                    <th className="p-2">강의시간/강의실</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-200">
                  {enrolledCourses.map((c, i) => (
                    <tr key={c.code}>
                      <td className="p-2 text-center font-mono-code">{i + 1}</td>
                      <td className="p-2 font-mono-code font-bold">{c.code}</td>
                      <td className="p-2 font-medium">{c.title}</td>
                      <td className="p-2 text-center">{c.type}</td>
                      <td className="p-2 text-center font-mono-code font-bold">{c.credits}</td>
                      <td className="p-2">{c.prof}</td>
                      <td className="p-2 text-[11px]">
                        {c.schedule} ({c.loc})
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              <div className="flex justify-between items-center bg-gray-50 p-3 rounded border border-gray-200 text-[12px] font-bold mb-6">
                <span>총 신청 과목수: {enrolledCourses.length}과목</span>
                <span className="text-[#00236f] text-[13px]">
                  총 신청 학점: {totalCredits} / 21 학점
                </span>
              </div>

              <div className="text-center text-[12px] text-gray-500 mt-4 leading-relaxed">
                위 사람은 2024학년도 제2학기 학사과정 수강신청을 위와 같이 적법하게 완료하였음을 증명합니다.
                <div className="mt-4 font-bold text-[14px] text-gray-800 flex items-center justify-center gap-4">
                  <span>한국대학교 교무처장</span>
                  <span className="w-10 h-10 rounded-full border-2 border-red-600 text-red-600 text-[9px] flex items-center justify-center font-bold tracking-tighter">
                    한국대<br />직인
                  </span>
                </div>
              </div>
            </div>

            <div className="mt-4 flex items-center justify-end gap-2 no-print">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 text-[13px] rounded-lg border border-gray-300 hover:bg-gray-100 text-gray-700 font-medium"
              >
                닫기
              </button>
              <button
                type="button"
                onClick={handlePrint}
                className="px-4 py-2 text-[13px] rounded-lg bg-[#00236f] hover:bg-[#1e3a8a] text-white font-bold flex items-center gap-1.5 shadow-sm"
              >
                <span className="material-symbols-outlined text-[16px]">print</span>
                <span>인쇄 / PDF 저장</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- 11. POLICY NOTICE COMPONENT ---
    function PolicyNotice() {
      return (
        <section className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-8">
          <div className="flex items-center gap-2 mb-3">
            <span className="material-symbols-outlined text-amber-500 text-[22px]">policy</span>
            <h3 className="font-bold text-sm text-[#00236f]">
              2024-2학기 수강신청 학사 규정 및 부정행위 방지 안내
            </h3>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs text-gray-600">
            <div className="p-3 bg-gray-50 rounded-lg border border-gray-200/80">
              <span className="font-bold text-gray-800 block mb-1">
                1. 2단계 보안 번호 인증 (Anti-Macro)
              </span>
              수강신청 클릭 시 화면에 임의 왜곡되어 표시되는 5자리 학수번호 코드를 60초 이내에
              정확히 입력해야 최종 등록됩니다. 3회 이상 불일치 시 일정 시간 신청이 제한됩니다.
            </div>

            <div className="p-3 bg-gray-50 rounded-lg border border-gray-200/80">
              <span className="font-bold text-gray-800 block mb-1">
                2. 최대 신청 학점 및 중복 제한
              </span>
              정규 학기 최대 수강 신청 한도는 21학점입니다. 동일 교과목 재수강 또는 강의시간이
              단 1분이라도 겹치는 시간표 중복 과목은 시스템상 자동 승인 거절됩니다.
            </div>

            <div className="p-3 bg-gray-50 rounded-lg border border-gray-200/80">
              <span className="font-bold text-gray-800 block mb-1">
                3. 실시간 수강 정원 및 취소 정책
              </span>
              수강신청 완료 과목을 취소할 경우 잔여석은 취소 즉시 전체 학생에게 실시간으로
              개방됩니다. 오취소에 따른 정원 손실은 복구되지 않으므로 각별히 유의바랍니다.
            </div>

            <div className="p-3 bg-gray-50 rounded-lg border border-gray-200/80">
              <span className="font-bold text-gray-800 block mb-1">
                4. 이중 로그인 방지 및 세션 유지
              </span>
              동일 학번으로 다중 기기(PC/모바일 동시 접속) 로그인 시 이전 접속 세션은 즉시 강제
              종료됩니다. 10분 이상 무작업 시 자동 로그아웃되므로 상단 [연장]을 활용하십시오.
            </div>
          </div>
        </section>
      );
    }

    // --- 12. FOOTER COMPONENT ---
    function Footer() {
      return (
        <footer className="w-full bg-[#f0f3ff] border-t border-[#dce1ff] mt-10">
          <div className="max-w-7xl mx-auto px-4 md:px-6 py-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 text-[#444651] text-[12px]">
            <div>
              <p className="font-bold text-[#151c27] mb-1">한국대학교 정보화본부 학사전산팀</p>
              <p>
                긴급 기술지원 문의: 02-1234-5678, 5679 | 수강신청 전용 상담센터: 운영시간 09:00 - 18:00
              </p>
              <p className="text-gray-400 text-[11px] mt-1">
                본 시스템은 한국표준시(KST) 및 고성능 NTP 서버 클록과 밀리초 단위로 동기화되고 있습니다.
              </p>
            </div>
            <div className="flex flex-col md:items-end gap-1">
              <p className="text-gray-400 font-mono-code text-[11px]">
                © 2024 Hankuk University. All rights reserved.
              </p>
            </div>
          </div>
        </footer>
      );
    }

    // --- 13. ROOT APPLICATION COMPONENT ---
    function App() {
      const [courses, setCourses] = useState(INITIAL_COURSES);
      const [basketList, setBasketList] = useState(INITIAL_BASKET);
      const [enrolledCourses, setEnrolledCourses] = useState(INITIAL_ENROLLED);
      const [currentTab, setCurrentTab] = useState('search');
      const [pendingCourseForCaptcha, setPendingCourseForCaptcha] = useState(null);
      const [isPdfModalOpen, setIsPdfModalOpen] = useState(false);
      const [sessionSeconds, setSessionSeconds] = useState(598);
      const [toasts, setToasts] = useState([]);

      const MAX_CREDITS = 21;

      useEffect(() => {
        const timer = setInterval(() => {
          setSessionSeconds((prev) => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const enrolledCodes = useMemo(
        () => new Set(enrolledCourses.map((c) => c.code)),
        [enrolledCourses]
      );

      const registeredCredits = useMemo(
        () => enrolledCourses.reduce((acc, c) => acc + c.credits, 0),
        [enrolledCourses]
      );

      const basketCredits = useMemo(
        () => basketList.reduce((acc, c) => acc + c.credits, 0),
        [basketList]
      );

      const showToast = (message, type = 'success') => {
        const id = `${Date.now()}-${Math.random()}`;
        setToasts((prev) => [...prev, { id, message, type }]);

        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3800);
      };

      const handleDismissToast = (id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      };

      const handleExtendSession = () => {
        setSessionSeconds(600);
        showToast('수강신청 로그인 세션이 10분 연장되었습니다.', 'info');
      };

      const hasTimeConflict = (target) => {
        const [targetDaysPart, targetTimePart] = target.schedule.split(' ');
        if (!targetDaysPart || !targetTimePart) return false;
        const targetDays = targetDaysPart.split('/');

        return enrolledCourses.some((existing) => {
          const [exDaysPart, exTimePart] = existing.schedule.split(' ');
          if (!exDaysPart || !exTimePart) return false;
          const exDays = exDaysPart.split('/');

          const dayOverlap = targetDays.some((d) => exDays.includes(d));
          if (!dayOverlap) return false;

          if (targetTimePart === exTimePart) return true;
          if (
            (targetTimePart.includes('13:00') && exTimePart.includes('13:00')) ||
            (targetTimePart.includes('15:00') && exTimePart.includes('15:00'))
          ) {
            return true;
          }
          return false;
        });
      };

      const handleApplyCourse = (target) => {
        if (enrolledCodes.has(target.code)) {
          showToast(`'${target.title}' 강좌는 이미 수강신청 완료된 과목입니다.`, 'info');
          return;
        }

        if (target.enrolled >= target.max || target.closed) {
          showToast('선택하신 강좌는 수강 정원이 마감되었습니다.', 'danger');
          return;
        }

        if (registeredCredits + target.credits > MAX_CREDITS) {
          showToast(
            `신청 한도 초과! 최대 ${MAX_CREDITS}학점까지만 수강 가능합니다. (현재: ${registeredCredits}학점)`,
            'danger'
          );
          return;
        }

        if (hasTimeConflict(target)) {
          showToast(
            `[시간표 중복 거절] 기존 신청 과목과 수업 시간(${target.schedule})이 중복됩니다.`,
            'danger'
          );
          return;
        }

        setPendingCourseForCaptcha(target);
      };

      const handleCaptchaSuccess = (confirmedCourse) => {
        setEnrolledCourses((prev) => [...prev, confirmedCourse]);

        setCourses((prev) =>
          prev.map((c) => {
            if (c.code === confirmedCourse.code) {
              const newEnrolled = c.enrolled + 1;
              return {
                ...c,
                enrolled: newEnrolled,
                closed: newEnrolled >= c.max,
              };
            }
            return c;
          })
        );

        setBasketList((prev) =>
          prev.map((b) => {
            if (b.code === confirmedCourse.code) {
              const newEnrolled = b.enrolled + 1;
              return {
                ...b,
                enrolled: newEnrolled,
                closed: newEnrolled >= b.max,
              };
            }
            return b;
          })
        );

        setPendingCourseForCaptcha(null);
        showToast(`[신청 완료] '${confirmedCourse.title}' 강좌가 정상 등록되었습니다!`, 'success');
      };

      const handleCancelEnrollment = (code) => {
        const target = enrolledCourses.find((c) => c.code === code);
        if (!target) return;

        if (
          !window.confirm(
            `'${target.title}' 과목의 수강신청을 취소하시겠습니까?\n취소 시 잔여석이 즉시 다른 학생에게 반환됩니다.`
          )
        ) {
          return;
        }

        setEnrolledCourses((prev) => prev.filter((c) => c.code !== code));

        setCourses((prev) =>
          prev.map((c) => {
            if (c.code === code) {
              const newEnrolled = Math.max(0, c.enrolled - 1);
              return {
                ...c,
                enrolled: newEnrolled,
                closed: false,
              };
            }
            return c;
          })
        );

        setBasketList((prev) =>
          prev.map((b) => {
            if (b.code === code) {
              return {
                ...b,
                enrolled: Math.max(0, b.enrolled - 1),
                closed: false,
              };
            }
            return b;
          })
        );

        showToast(`'${target.title}' 수강신청이 정상적으로 취소되었습니다.`, 'info');
      };

      const handleRemoveFromBasket = (code) => {
        const target = basketList.find((b) => b.code === code);
        setBasketList((prev) => prev.filter((b) => b.code !== code));
        if (target) {
          showToast(`'${target.title}' 과목을 장바구니에서 삭제했습니다.`, 'info');
        }
      };

      return (
        <div className="min-h-screen bg-[#F3F4F6] text-[#151c27] flex flex-col font-sans">
          <ToastContainer toasts={toasts} onDismiss={handleDismissToast} />

          <Header
            currentTab={currentTab}
            onSelectTab={setCurrentTab}
            registeredCredits={registeredCredits}
            maxCredits={MAX_CREDITS}
            registeredCount={enrolledCourses.length}
            basketCount={basketList.length}
            onExtendSession={handleExtendSession}
            sessionSeconds={sessionSeconds}
          />

          <main className="flex-1 w-full pt-[130px] pb-12">
            <div className="max-w-7xl mx-auto px-4 md:px-6">
              <HudCards
                registeredCredits={registeredCredits}
                maxCredits={MAX_CREDITS}
                registeredCount={enrolledCourses.length}
                basketCount={basketList.length}
                basketCredits={basketCredits}
                onSwitchTab={setCurrentTab}
              />

              <section className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                <div className="flex flex-wrap items-center justify-between border-b border-gray-200 px-4 sm:px-6 pt-3 bg-[#f9f9ff]">
                  <div className="flex items-center gap-1 sm:gap-2">
                    <button
                      type="button"
                      onClick={() => setCurrentTab('search')}
                      className={`flex items-center gap-1.5 px-3 sm:px-4 py-3 text-[14px] font-bold border-b-2 transition-all ${
                        currentTab === 'search'
                          ? 'text-[#00236f] border-[#00236f]'
                          : 'text-[#444651] border-transparent hover:text-[#151c27]'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">search</span>
                      <span>개설 강좌 조회 및 신청</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setCurrentTab('basket')}
                      className={`flex items-center gap-1.5 px-3 sm:px-4 py-3 text-[14px] font-bold border-b-2 transition-all ${
                        currentTab === 'basket'
                          ? 'text-[#00236f] border-[#00236f]'
                          : 'text-[#444651] border-transparent hover:text-[#151c27]'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">shopping_bag</span>
                      <span>장바구니 (관심과목)</span>
                      <span className="ml-1 px-1.5 py-0.2 rounded-full bg-[#0051d5] text-white font-mono-code text-[11px]">
                        {basketList.length}
                      </span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setCurrentTab('timetable')}
                      className={`flex items-center gap-1.5 px-3 sm:px-4 py-3 text-[14px] font-bold border-b-2 transition-all ${
                        currentTab === 'timetable'
                          ? 'text-[#00236f] border-[#00236f]'
                          : 'text-[#444651] border-transparent hover:text-[#151c27]'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">calendar_month</span>
                      <span>내 시간표 미리보기</span>
                    </button>
                  </div>

                  <div className="hidden md:flex items-center gap-2 py-2 text-[12px] text-[#444651]">
                    <span className="material-symbols-outlined text-[#F59E0B] text-[18px]">
                      notifications_active
                    </span>
                    <span>정원 마감 임박 강좌는 즉시 붉은색 게이지로 표시됩니다.</span>
                  </div>
                </div>

                {currentTab === 'search' && (
                  <CourseSearchPane
                    courses={courses}
                    enrolledCodes={enrolledCodes}
                    onApplyCourse={handleApplyCourse}
                  />
                )}

                {currentTab === 'basket' && (
                  <BasketPane
                    basketList={basketList}
                    enrolledCodes={enrolledCodes}
                    onApplyCourse={handleApplyCourse}
                    onRemoveFromBasket={handleRemoveFromBasket}
                  />
                )}

                {currentTab === 'timetable' && (
                  <TimetablePane enrolledCourses={enrolledCourses} />
                )}
              </section>

              <EnrolledLedger
                enrolledCourses={enrolledCourses}
                maxCredits={MAX_CREDITS}
                onCancelEnrollment={handleCancelEnrollment}
                onOpenPdfModal={() => setIsPdfModalOpen(true)}
              />

              <PolicyNotice />
            </div>
          </main>

          <CaptchaModal
            course={pendingCourseForCaptcha}
            onClose={() => setPendingCourseForCaptcha(null)}
            onSuccess={handleCaptchaSuccess}
          />

          <PdfModal
            isOpen={isPdfModalOpen}
            onClose={() => setIsPdfModalOpen(false)}
            enrolledCourses={enrolledCourses}
            totalCredits={registeredCredits}
          />

          <Footer />
        </div>
      );
    }

    // DOM Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
